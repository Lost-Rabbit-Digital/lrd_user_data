[plugin]

name="Manage User Data"
description="A Godot 4 editor plugin for browsing and managing your game's user:// directory without leaving the editor. A checkbox tree with sizes, search and type filters (files, folders, .json, .cache, save backups and temp files, test-runner data, logs), a read-only preview of JSON, text, binary and images, sorting by name, size or date, and optional auto-refresh. Delete selected files and folders after a confirmation (only checked, visible rows are ever removed), or right-click one row to copy its path, show it in the file manager or delete just it. Zip the selection for a bug report and restore such a zip. Optionally clean chosen items (paths, folders, *.tmp globs) automatically every time you press Play. Useful for resetting save data, wiping caches, or inspecting what your game writes to disk."
author="Lost Rabbit Digital"
version="2.13.2"
min_godot_version="4.3"
script="plugin.gd"
